name: CI

# The pipeline runs on every pull request into main, and again on main itself
# after a merge. The PR run is the one that matters: it is what branch
# protection blocks the merge button on.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still in flight. Only
# the newest commit of a branch is worth spending CI minutes on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Static checks. Cheapest signal, so it runs first and gates the test job.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

  # Unit tests only: no Postgres, no Redis, no network. Integration and e2e
  # jobs join this workflow in the PRs that introduce those tests.
  unit:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # Guards against the most common TypeORM mistake: editing an entity and
  # forgetting the migration. The schema in migrations must fully describe the
  # entities, or `migration:generate` would have something to write.
  migration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payroll
          POSTGRES_PASSWORD: payroll
          POSTGRES_DB: payroll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payroll -d payroll"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://payroll:payroll@localhost:5432/payroll
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Proves the migration actually applies to an empty database, not just
      # that a file exists.
      - name: Apply migrations
        run: npm run migration:run
        working-directory: apps/backend

      - name: Fail if entities and migrations disagree
        working-directory: apps/backend
        run: |
          set +e
          output=$(npm run migration:generate -- src/database/migrations/DriftCheck 2>&1)
          set -e
          echo "$output"
          # typeorm exits 1 both when there is nothing to generate and when it
          # cannot connect, so match the message rather than the exit code.
          if echo "$output" | grep -q "No changes in database schema were found"; then
            echo "Entities and migrations are in sync."
          else
            echo "::error::Entity changes are missing a migration. Run npm run migration:generate."
            exit 1
          fi

  # Tests whose subject is the SQL itself — row locking, the staleness
  # predicate, transactional writes — which a mocked repository cannot stand in
  # for. They need a real Postgres, so they run as their own job.
  integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payroll
          POSTGRES_PASSWORD: payroll
          POSTGRES_DB: payroll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payroll -d payroll"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://payroll:payroll@localhost:5432/payroll
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run migration:run
        working-directory: apps/backend

      - name: Run integration tests
        run: npm run test:integration

  # Deliberately not `needs: quality`. A broken Dockerfile is an independent
  # failure from a lint error, and we want both reported in the same run
  # instead of discovering the second one only after fixing the first.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
