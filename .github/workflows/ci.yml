name: CI

# The pipeline runs on every pull request into main, and again on main itself
# after a merge. The PR run is the one that matters: it is what branch
# protection blocks the merge button on.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still in flight. Only
# the newest commit of a branch is worth spending CI minutes on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Static checks. Cheapest signal, so it runs first and gates the test job.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

  # Unit tests only: no Postgres, no Redis, no network. Integration and e2e
  # jobs join this workflow in the PRs that introduce those tests.
  unit:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # Deliberately not `needs: quality`. A broken Dockerfile is an independent
  # failure from a lint error, and we want both reported in the same run
  # instead of discovering the second one only after fixing the first.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
